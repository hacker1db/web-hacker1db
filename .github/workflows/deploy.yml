name: Deploy to Vercel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.33.2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm build

    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: team_mV7CedZ5PAJgjKYpAzU03DdY
        VERCEL_PROJECT_ID: prj_ck8URv7qvke1I9dfc7PdrmkBH6dr
      run: |
        pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        pnpm dlx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
