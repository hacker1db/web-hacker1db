name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run type check
      run: bun run check

    - name: Run linter
      run: bun run lint

    - name: Run tests
      run: bun run test

    - name: Build project
      run: bun run build
